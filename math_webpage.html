<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Markdown & Math Previewer</title>
  
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- MathJax Configuration & Library -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'has-math'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f4f4f9;
    }
    header {
      background-color: #24292e;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-input-wrapper {
      font-size: 14px;
    }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow: hidden;
    }
    .pane-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #555;
      text-transform: uppercase;
    }
    textarea {
      flex: 1;
      width: 100%;
      padding: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: none;
      outline: none;
    }
    #preview {
      flex: 1;
      padding: 15px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow-y: auto;
      line-height: 1.6;
    }
    /* Simple styling for Markdown elements */
    #preview h1, #preview h2, #preview h3 { margin-bottom: 10px; margin-top: 15px; }
    #preview p { margin-bottom: 10px; }
    #preview code { background: #f0f0f0; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
    #preview pre { background: #f6f8fa; padding: 10px; border-radius: 4px; overflow-x: auto; margin-bottom: 10px; }
    #preview blockquote { border-left: 4px solid #ddd; padding-left: 10px; color: #666; margin-bottom: 10px; }
    #preview table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    #preview th, #preview td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>

  <header>
    <h3>Markdown + Math Live Editor</h3>
    <div class="file-input-wrapper">
      <label for="fileInput">Load .md file: </label>
      <input type="file" id="fileInput" accept=".md,.txt">
    </div>
  </header>

  <div class="container">
    <div class="pane">
      <div class="pane-title">Input Markdown</div>
      <textarea id="editor" placeholder="Type or paste Markdown here..."></textarea>
    </div>
    <div class="pane">
      <div class="pane-title">Live Preview</div>
      <div id="preview" class="has-math"></div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const fileInput = document.getElementById('fileInput');

    // Default sample text
    const sampleMarkdown = `# Mathematical Markdown Demo

Write standard markdown alongside inline math like $E = mc^2$ or block math equations:

$$ \\int_{0}^{\\infty} e^{-x^2} dx = \\frac{\\sqrt{\\pi}}{2} $$

### Features
* **Live rendering** as you type
* **File upload** support for \`.md\` documents
* **MathJax** support for LaTeX formulas`;

    editor.value = sampleMarkdown;

    // Render Markdown and process MathJax
    function renderContent() {
      const rawMarkdown = editor.value;
      
      // Render HTML via Marked
      preview.innerHTML = marked.parse(rawMarkdown);
      
      // Trigger MathJax to typeset the new HTML content
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([preview]).catch((err) => console.log(err.message));
      }
    }

    // Event listener for typing
    editor.addEventListener('input', renderContent);

    // Event listener for reading local files
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        editor.value = event.target.result;
        renderContent();
      };
      reader.readAsText(file);
    });

    // Initial render
    renderContent();
  </script>
</body>
</html>
