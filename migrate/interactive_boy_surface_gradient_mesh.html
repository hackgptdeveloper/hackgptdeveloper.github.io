<html lang="en">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Boy's Surface — Gradient Mesh</title>
  <style>
    :root { color-scheme: dark; --panel: rgba(8, 12, 22, .86); --border: rgba(180, 220, 255, .22); --text: #eaf3ff; --muted: #b0bfd7; --accent: #63dcff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03050a; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    .panel { position: fixed; z-index: 2; top: 16px; left: 16px; width: min(390px, calc(100vw - 32px)); padding: 16px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); box-shadow: 0 14px 44px #0008; backdrop-filter: blur(12px); }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; font-size: 13px; }
    input[type=range] { width: 162px; accent-color: var(--accent); }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button { color: var(--text); background: #ffffff12; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer; }
    button:hover { background: #48dfff29; border-color: #72dcffb3; }
    .status { margin-top: 12px; color: #bdd5f3; font-size: 12px; }
    .legend { position: fixed; right: 16px; bottom: 16px; color: #b4c6de; font-size: 12px; line-height: 1.45; text-align: right; pointer-events: none; text-shadow: 0 1px 3px #000; }
    @media(max-width:560px) { .panel { top: 10px; left: 10px; padding: 13px; } input[type=range] { width: 120px; } .legend { right: 10px; bottom: 10px; } }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KC57H5P9"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  <canvas id="canvas" aria-label="Interactive gradient-mesh Boy's surface"></canvas>
  <section class="panel">
    <h1>Boy's Surface · Spectral Mesh</h1>
    <p>Drag to rotate; use the wheel or pinch to zoom. A rainbow gradient is carried by every mesh line, inspired by the attached surface-grid rendering.</p>
    <div class="controls">
      <label for="speed">Auto-rotation speed</label><input id="speed" type="range" min="0" max="1.4" step="0.01" value="0.28">
      <label for="resolution">Surface resolution</label><input id="resolution" type="range" min="60" max="190" step="10" value="120">
      <label for="mesh">Mesh spacing</label><input id="mesh" type="range" min="2" max="12" step="1" value="5">
    </div>
    <div class="buttons">
      <button id="reset" type="button">Reset view</button>
      <button id="toggle" type="button">Pause rotation</button>
      <button id="style" type="button">Softer mesh</button>
    </div>
    <div id="status" class="status">Auto-rotation active</div>
  </section>
  <div class="legend">Bryant–Kusner parametrization<br>Colour encodes the disk parameter angle</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const speedInput = document.getElementById('speed');
  const resolutionInput = document.getElementById('resolution');
  const meshInput = document.getElementById('mesh');
  const status = document.getElementById('status');
  const toggle = document.getElementById('toggle');
  let width=0, height=0, dpr=1, vertices=[], rows=[], cols=[];
  let rotation=identity(), zoom=3.05, dragging=false, pointer=null, paused=false, softMesh=false;
  let lastInteraction=performance.now(), lastFrame=performance.now(), axisTarget=randomAxis(), axisCurrent=axisTarget.slice(), nextAxis=performance.now()+3500;

  function resize() { dpr=Math.min(devicePixelRatio||1,2); width=innerWidth; height=innerHeight; canvas.width=width*dpr; canvas.height=height*dpr; canvas.style.width=width+'px'; canvas.style.height=height+'px'; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function identity(){ return [1,0,0,0]; }
  function qnorm(q){ const n=Math.hypot(...q)||1; return q.map(v=>v/n); }
  function qmul(a,b){ return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]]; }
  function qaxis(a,t){ const s=Math.sin(t/2); return [Math.cos(t/2),a[0]*s,a[1]*s,a[2]*s]; }
  function turn(q,p){ const [w,x,y,z]=q, tx=2*(y*p[2]-z*p[1]),ty=2*(z*p[0]-x*p[2]),tz=2*(x*p[1]-y*p[0]); return [p[0]+w*tx+y*tz-z*ty,p[1]+w*ty+z*tx-x*tz,p[2]+w*tz+x*ty-y*tx]; }
  function norm(v){ const n=Math.hypot(...v)||1; return v.map(x=>x/n); }
  function randomAxis(){ const z=Math.random()*2-1,t=Math.random()*Math.PI*2,r=Math.sqrt(1-z*z); return [r*Math.cos(t),r*Math.sin(t),z]; }
  function blendAxis(a,b,t){ return norm([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]); }

  function boyPoint(u,v) {
    const w={r:u,i:v};
    const add=(a,b)=>({r:a.r+b.r,i:a.i+b.i}), sub=(a,b)=>({r:a.r-b.r,i:a.i-b.i});
    const mul=(a,b)=>({r:a.r*b.r-a.i*b.i,i:a.r*b.i+a.i*b.r});
    const div=(a,b)=>{const d=b.r*b.r+b.i*b.i;return {r:(a.r*b.r+a.i*b.i)/d,i:(a.i*b.r-a.r*b.i)/d};};
    const pow=(a,n)=>{let p={r:1,i:0};while(n--)p=mul(p,a);return p;};
    const w3=pow(w,3),w4=pow(w,4),w6=pow(w,6);
    const D=add(add(w6,{r:Math.sqrt(5)*w3.r,i:Math.sqrt(5)*w3.i}),{r:-1,i:0});
    const a=div(mul(w,sub({r:1,i:0},w4)),D), b=div(mul(w,add({r:1,i:0},w4)),D), c=div(add({r:1,i:0},w6),D);
    const g1=-1.5*a.i, g2=-1.5*b.r, g3=c.i-.5, den=g1*g1+g2*g2+g3*g3;
    return [g1/den,g2/den,g3/den];
  }

  function buildMesh(n) {
    const angular=n*2; vertices=[]; rows=[]; cols=Array.from({length:angular},()=>[]);
    for(let i=0;i<=n;i++) {
      const row=[]; const r=i/n;
      for(let j=0;j<angular;j++) { const t=j/angular*Math.PI*2; const p=boyPoint(r*Math.cos(t),r*Math.sin(t)); const item={p, hue:(j/angular*360+18)%360, radial:r}; vertices.push(item); row.push(item); cols[j].push(item); }
      rows.push(row);
    }
  }
  function hsl(h,s,l,a=1){ return `hsla(${h},${s}%,${l}%,${a})`; }
  function gradientLine(points, hueShift, widthLine, alpha) {
    for(let i=0;i<points.length-1;i++) {
      const a=points[i],b=points[i+1];
      const hue=(a.hue+hueShift)%360;
      const light=softMesh ? 61 : 54;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=hsl(hue,90,light,alpha);
      ctx.lineWidth=widthLine;ctx.stroke();
    }
  }
  function render() {
    const bg=ctx.createRadialGradient(width*.5,height*.46,0,width*.5,height*.5,Math.max(width,height)*.7);
    bg.addColorStop(0,'#131b2f');bg.addColorStop(.52,'#060a15');bg.addColorStop(1,'#010208');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);
    const focal=Math.min(width,height)*.9;
    for(const v of vertices) { const p=turn(rotation,v.p), z=p[2]+zoom; v.x=width/2+p[0]*focal/z; v.y=height/2-p[1]*focal/z; v.z=z; }
    // Faint translucent surface establishes the silhouette while preserving the coloured grid.
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<rows.length-1;i++) for(let j=0;j<rows[0].length;j++) {
      const k=(j+1)%rows[0].length,a=rows[i][j],b=rows[i+1][j],c=rows[i+1][k],d=rows[i][k];
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();
      const hue=(a.hue+35)%360;ctx.fillStyle=hsl(hue,55,25,softMesh?.055:.09);ctx.fill();
    }
    ctx.globalCompositeOperation='lighter';
    const step=Number(meshInput.value);
    const radialLines=rows.filter((_,i)=>i%step===0 || i===rows.length-1);
    const angularLines=cols.filter((_,i)=>i%step===0);
    // Longitudinal and transverse line families each receive continuous spectrum variation.
    for(let i=0;i<angularLines.length;i++) gradientLine(angularLines[i], i*17, softMesh?.55:.85, softMesh?.52:.8);
    for(let i=0;i<radialLines.length;i++) gradientLine(radialLines[i], i*9+75, softMesh?.6:.9, softMesh?.5:.76);
    ctx.globalCompositeOperation='source-over';
  }
  function activity(){lastInteraction=performance.now();status.textContent=paused?'Rotation paused':'Manual control — auto-rotation resumes shortly';}
  canvas.addEventListener('pointerdown',e=>{dragging=true;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);pointer={x:e.clientX,y:e.clientY};activity();});
  canvas.addEventListener('pointermove',e=>{if(!dragging||!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer={x:e.clientX,y:e.clientY};rotation=qnorm(qmul(qaxis([0,1,0],dx*.008),qmul(qaxis([1,0,0],dy*.008),rotation)));activity();});
  function release(){dragging=false;pointer=null;canvas.classList.remove('dragging');}
  canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1.35,Math.min(7.5,zoom+e.deltaY*.0035));activity();},{passive:false});
  document.getElementById('reset').onclick=()=>{rotation=qnorm(qmul(qaxis([1,0,0],-.38),qaxis([0,1,0],.55)));zoom=3.05;lastInteraction=performance.now()-2600;status.textContent=paused?'Rotation paused':'Auto-rotation active';};
  toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'Resume rotation':'Pause rotation';status.textContent=paused?'Rotation paused':'Auto-rotation active';if(!paused)lastInteraction=performance.now()-2600;};
  document.getElementById('style').onclick=()=>{softMesh=!softMesh;document.getElementById('style').textContent=softMesh?'Vivid mesh':'Softer mesh';};
  resolutionInput.oninput=()=>buildMesh(+resolutionInput.value);
  addEventListener('resize',resize);
  function frame(now){const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;if(!paused&&!dragging&&now-lastInteraction>2200){if(now>nextAxis){axisTarget=randomAxis();nextAxis=now+2500+Math.random()*4000;}axisCurrent=blendAxis(axisCurrent,axisTarget,Math.min(1,dt*.32));rotation=qnorm(qmul(qaxis(axisCurrent,+speedInput.value*dt),rotation));status.textContent='Auto-rotation active';}render();requestAnimationFrame(frame);}
  resize();buildMesh(+resolutionInput.value);rotation=qnorm(qmul(qaxis([1,0,0],-.38),qaxis([0,1,0],.55)));requestAnimationFrame(frame);
})();
</script>
</body>
</html>
